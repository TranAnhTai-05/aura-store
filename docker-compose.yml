# Optional local SQL Server for development. Create DB_NAME in SSMS after it starts.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aura-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - aura-sqlserver-data:/var/opt/mssql

volumes:
  aura-sqlserver-data:
