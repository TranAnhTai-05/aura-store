# Bản production. Jenkins chép tệp này vào C:\aura-deploy\docker-compose.yml.
# Giá trị bí mật nằm trong C:\aura-deploy\.env; xem mẫu ở docs/DEPLOY.md.
services:
  app:
    image: ${AURA_IMAGE}
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:4000"
    environment:
      NODE_ENV: production
      API_PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Cookie đăng nhập chỉ gửi qua HTTPS khi để trống. Đặt false khi web chạy http://<ip>
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    volumes:
      - aura-uploads:/app/server/uploads

  mysql:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # Không mở cổng MySQL ra ngoài; chỉ container app kết nối qua mạng nội bộ của compose
    volumes:
      - aura-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  aura-mysql-data:
  aura-uploads:
