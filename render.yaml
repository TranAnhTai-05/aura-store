# Render Blueprint: một web service build từ Dockerfile, phục vụ cả API lẫn giao diện.
# Render không có MySQL, nên cơ sở dữ liệu nằm ở nhà cung cấp ngoài (Aiven…); xem docs/DEPLOY.md.
services:
  - type: web
    name: aura-store
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    # Máy chủ chỉ mở cổng sau khi kết nối được MySQL, nên địa chỉ này cũng xác nhận CSDL đã sẵn sàng
    healthCheckPath: /api/health
    envVars:
      # Render tự sinh một chuỗi ngẫu nhiên và giữ nguyên qua các lần deploy
      - key: JWT_SECRET
        generateValue: true
      # Render đặt một proxy trước ứng dụng; cần để giới hạn số lần đăng nhập theo IP khách
      - key: TRUST_PROXY
        value: "1"
      - key: DB_SSL
        value: "true"
      # Các giá trị dưới đây nhập trong trang Render khi tạo Blueprint, không lưu trong repo
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      # Chứng chỉ CA của nhà cung cấp MySQL (nội dung tệp ca.pem)
      - key: DB_SSL_CA
        sync: false
