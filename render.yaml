# Render Blueprint: web service build từ Dockerfile; SQL Server được host riêng (ví dụ GearHost).
services:
  - type: web
    name: aura-store
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    # Máy chủ chỉ mở cổng sau khi kết nối được SQL Server, nên địa chỉ này cũng xác nhận CSDL đã sẵn sàng
    healthCheckPath: /api/health
    envVars:
      # Render tự sinh một chuỗi ngẫu nhiên và giữ nguyên qua các lần deploy
      - key: JWT_SECRET
        generateValue: true
      # Render đặt một proxy trước ứng dụng; cần để giới hạn số lần đăng nhập theo IP khách
      - key: TRUST_PROXY
        value: "1"
      - key: DB_ENCRYPT
        value: "true"
      # Các giá trị dưới đây nhập trong trang Render khi tạo Blueprint, không lưu trong repo
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_TRUST_SERVER_CERTIFICATE
        sync: false
