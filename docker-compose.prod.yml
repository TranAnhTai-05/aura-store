# Production app container. The SQL Server database is hosted separately; credentials
# are provided by C:\aura-deploy\.env (see docs/DEPLOY.md).
services:
  app:
    image: ${AURA_IMAGE}
    restart: always
    ports:
      - "${APP_PORT:-80}:4000"
    environment:
      NODE_ENV: production
      API_PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-1433}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_ENCRYPT: ${DB_ENCRYPT:-true}
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    volumes:
      - aura-uploads:/app/server/uploads

volumes:
  aura-uploads:
